function lineEdit(i,k,v){draft.lines[i][k]=['qty','price'].includes(k)?Math.max(0,Number(v)||0):v;updateTotals()}function updateTotals(){let t=total(draft);if($('sum'))$('sum').innerHTML=`未稅 ${money(t.sub)}　稅額 ${money(t.tax)}<br>合計 ${money(t.sum)}`;draft.lines.forEach((l,i)=>{if($('lineSum'+i))$('lineSum'+i).textContent=money(l.qty*l.price)})}function saveQuote(){if(!draft.customer.trim()||!draft.lines.length){alert('請先填客戶並至少加入一項服務');return false}const q=JSON.parse(JSON.stringify(draft)),i=db.quotes.findIndex(x=>x.id===q.id);if(i<0)db.quotes.unshift(q);else db.quotes[i]=q;persist();alert('報價單已儲存在此瀏覽器');return true}
function doc(q){let t=total(q),im=q.brand==='Murmur'?MUR:LOGO;return `<div class="preview"><div class="preview-head"><img src="${im}"><div><h2>QUOTATION<br><span style="font-size:14px;font-weight:400">設計服務報價單</span></h2><div class="muted">${safe(q.number)}</div></div></div><hr style="border:0;border-top:1px solid #e9e3f2;margin:20px 0"><div style="display:flex;justify-content:space-between;gap:15px"><div><b>客戶：</b>${safe(q.customer)}<br><b>專案：</b>${safe(q.title)}</div><div><b>日期：</b>${safe(q.date)}</div></div><h3 style="color:#806bb9;margin-bottom:6px">PROJECT CONCEPT｜專案說明</h3><div class="intro">${safe(q.intro)}</div><table style="margin-top:20px"><thead><tr><th>服務內容</th><th>數量</th><th>單價</th><th>小計</th></tr></thead><tbody>${q.lines.map(l=>`<tr><td><b>${safe(l.name)}</b><div class="muted" style="white-space:pre-wrap">${safe(l.description)}</div></td><td>${safe(l.qty)}</td><td>${money(l.price)}</td><td>${money(l.qty*l.price)}</td></tr>`).join('')}</tbody></table><div style="text-align:right;margin-top:20px">未稅金額 ${money(t.sub)}<br>稅額 ${money(t.tax)}<h2 style="color:#7864b9">報價合計 ${money(t.sum)}</h2></div><h3>付款條件與備註</h3><div class="note">${safe(q.terms)}</div><p class="muted" style="margin-top:24px">${q.brand==='Murmur'?'Murmur Design Studio':'LOHLAN 樂嵐智慧科技'}｜本文件為報價資料，非統一發票。</p></div>`}function showPreview(){const h=$('previewHost');h.innerHTML='<div class="panel"><h2>報價單預覽</h2>'+doc(draft)+'</div>';h.scrollIntoView({behavior:'smooth'})}function pdf(){if(!draft.customer.trim()||!draft.lines.length){alert('請先填客戶並至少加入一項服務');return}saveQuote();$('paper').innerHTML=doc(draft);window.print()}function copyLine(){if(!draft.customer.trim()){alert('請先填客戶');return}let t=total(draft);const msg=`${draft.brand} 報價通知\n客戶：${draft.customer}\n專案：${draft.title}\n${draft.lines.map(x=>x.name+' '+money(x.qty*x.price)).join('\n')}\n合計：${money(t.sum)}\n詳細內容請參閱報價單 PDF。`;navigator.clipboard?.writeText(msg).then(()=>alert('已複製，可貼到 LINE'),()=>prompt('請複製以下文字',msg))||prompt('請複製以下文字',msg)}

function monthNow(){return new Date().toISOString().slice(0,7)}
function renderHome(){const month=monthNow(),b=db.bills.filter(x=>x.month===month),due=b.reduce((s,x)=>s+x.amount,0),paid=b.reduce((s,x)=>s+x.paid,0),exp=db.expenses.filter(x=>x.date.startsWith(month)).reduce((s,x)=>s+x.amount,0),mrr=db.contracts.filter(x=>x.active).reduce((s,x)=>s+x.amount,0);$('view').innerHTML=`<div class="panel"><h2>🌸 公司營運總覽</h2><p class="muted">LOHLAN 樂嵐智慧科技 × Murmur 毛毛設計｜三大業務：品牌設計、企業系統、網站設計</p><div class="cards"><div class="stat">💜 每月合約收入 MRR<b>${money(mrr)}</b></div><div class="stat">💌 本月應收<b>${money(due)}</b></div><div class="stat">✨ 本月已收<b>${money(paid)}</b></div><div class="stat">🧾 尚待收款<b>${money(due-paid)}</b></div><div class="stat">🪙 本月支出<b>${money(exp)}</b></div><div class="stat">🧸 客戶數<b>${db.customers.length}</b></div></div></div><div class="panel"><h2>🎀 快速開始</h2><div class="actions"><button onclick="go('quotes')">＋ 新增報價單</button><button onclick="go('services')">🎨 編輯營業項目</button><button onclick="go('contracts')">💜 建立月費合約</button><button onclick="go('billing')">💌 本月請款</button><button onclick="go('expenses')">🪙 登記支出</button></div></div><div class="panel"><h2>🧁 目前服務分類</h2><div class="cards">${['設計','系統','網站'].map((c,i)=>`<div class="stat">${['🎨','💻','🌐'][i]} ${c}服務<b>${db.services.filter(s=>s.category===c&&s.active).length} 項</b></div>`).join('')}</div></div>`}
function renderContracts(){$('view').innerHTML=`<div class="panel"><h2>💜 月費合約管理</h2><p class="muted">設定合約後，可每月產生應收帳款。試用版需手動按「產生本月請款」。</p><form onsubmit="addContract(event)"><div class="formgrid"><div><label>客戶</label><select name="customer" required>${db.customers.map(c=>`<option>${safe(c.name)}</option>`).join('')}</select></div><div><label>服務項目</label><select name="service" id="contractService" onchange="$('contractAmount').value=db.services.find(s=>s.id===Number(this.value))?.price||0">${db.services.filter(s=>s.active).map(s=>`<option value="${s.id}">${safe(s.name)}</option>`).join('')}</select></div><div><label>每月金額</label><input id="contractAmount" name="amount" type="number" min="0" value="${db.services.find(s=>s.active)?.price||0}" required></div><div><label>每月請款日（1–28）</label><input name="day" type="number" min="1" max="28" value="5" required></div><div><label>合約開始日</label><input name="start" type="date" value="${date()}" required></div><div><label>合約結束日（可空白）</label><input name="end" type="date"></div></div><button>＋ 建立合約</button></form></div><div class="panel"><h2>📋 合約列表</h2><div class="scroll"><table><thead><tr><th>客戶</th><th>服務</th><th>月費</th><th>請款日</th><th>有效期間</th><th>狀態</th><th>操作</th></tr></thead><tbody>${db.contracts.map(c=>`<tr><td>${safe(c.customer)}</td><td>${safe(c.service)}</td><td>${money(c.amount)}</td><td>每月 ${c.day} 日</td><td>${safe(c.start)} ～ ${safe(c.end||'持續')}</td><td>${c.active?'進行中':'已停用'}</td><td><button class="secondary" onclick="toggleContract(${c.id})">${c.active?'停用':'啟用'}</button></td></tr>`).join('')||'<tr><td colspan="7">尚無合約</td></tr>'}</tbody></table></div></div>`}
function addContract(e){e.preventDefault();const f=new FormData(e.target),s=db.services.find(x=>x.id===Number(f.get('service')));db.contracts.push({id:Date.now(),customer:f.get('customer'),service:s?.name||'',amount:Number(f.get('amount')),day:Number(f.get('day')),start:f.get('start'),end:f.get('end'),active:true});persist();render()}
function toggleContract(id){let c=db.contracts.find(x=>x.id===id);c.active=!c.active;persist();render()}
function generateBills(){let month=monthNow(),made=0;db.contracts.filter(c=>c.active&&c.start.slice(0,7)<=month&&(!c.end||c.end.slice(0,7)>=month)).forEach(c=>{if(!db.bills.some(b=>b.contractId===c.id&&b.month===month)){db.bills.push({id:Date.now()+made,contractId:c.id,month,customer:c.customer,service:c.service,amount:c.amount,paid:0,day:c.day});made++}});persist();alert(`已新增 ${made} 筆 ${month} 請款（重複的合約月份不會重複建立）`);render()}
function renderBilling(){$('view').innerHTML=`<div class="panel"><div class="toolbar"><h2>💌 每月請款與收款</h2><button onclick="generateBills()">✨ 產生本月請款</button></div><p class="muted">請款單與正式統一發票不同。入帳後請人工確認收款金額；目前不會自動連接銀行。</p><div class="scroll"><table><thead><tr><th>月份</th><th>客戶／服務</th><th>應收</th><th>已收</th><th>未收</th><th>狀態</th><th>操作</th></tr></thead><tbody>${db.bills.map(b=>`<tr><td>${safe(b.month)}</td><td>${safe(b.customer)}<div class="muted">${safe(b.service)}</div></td><td>${money(b.amount)}</td><td>${money(b.paid)}</td><td>${money(b.amount-b.paid)}</td><td>${b.paid>=b.amount?'已收':b.paid>0?'部分收款':'未收'}</td><td><button class="secondary" onclick="receiveBill(${b.id})">登記收款</button><button class="secondary" onclick="copyBill(${b.id})">複製 LINE 請款</button></td></tr>`).join('')||'<tr><td colspan="7">尚無請款資料，請先建立月費合約</td></tr>'}</tbody></table></div></div>`}
function receiveBill(id){const b=db.bills.find(x=>x.id===id),remaining=b.amount-b.paid;if(remaining<=0)return alert('此筆已全數收款');const value=prompt('請輸入本次實際收到的金額',String(remaining));if(value===null)return;const n=Number(value);if(!Number.isFinite(n)||n<=0||n>remaining)return alert('請輸入正確金額');b.paid+=n;persist();render()}
function copyBill(id){const b=db.bills.find(x=>x.id===id);navigator.clipboard?.writeText(`您好，${b.customer}：\n${b.month} ${b.service} 應收 ${money(b.amount)}，目前待收 ${money(b.amount-b.paid)}。\n感謝您的合作！`).then(()=>alert('已複製，可貼至 LINE')).catch(()=>alert('瀏覽器不允許複製，請改用支援的瀏覽器'))}
function renderExpenses(){$('view').innerHTML=`<div class="panel"><h2>🪙 公司支出記帳</h2><form onsubmit="addExpense(event)"><div class="formgrid"><div><label>日期</label><input type="date" name="date" value="${date()}" required></div><div><label>類別</label><select name="category">${['軟體訂閱','主機網域','外包成本','廣告行銷','交通','辦公用品','其他'].map(s=>`<option>${s}</option>`).join('')}</select></div><div><label>項目說明</label><input name="name" required placeholder="例如：主機月費"></div><div><label>金額 NT$</label><input type="number" name="amount" min="0" required></div></div><button>＋ 登記支出</button></form></div><div class="panel"><h2>支出紀錄</h2><div class="scroll"><table><thead><tr><th>日期</th><th>類別</th><th>項目</th><th>金額</th></tr></thead><tbody>${db.expenses.map(x=>`<tr><td>${safe(x.date)}</td><td>${safe(x.category)}</td><td>${safe(x.name)}</td><td>${money(x.amount)}</td></tr>`).join('')||'<tr><td colspan="4">尚無紀錄</td></tr>'}</tbody></table></div></div>`}
function addExpense(e){e.preventDefault();const f=new FormData(e.target);db.expenses.push({id:Date.now(),...Object.fromEntries(f),amount:Number(f.get('amount'))});persist();render()}
function renderProjects(){$('view').innerHTML=`<div class="panel"><h2>🧸 專案與工作進度</h2><form onsubmit="addProject(event)"><div class="formgrid"><div><label>客戶</label><select name="customer">${db.customers.map(c=>`<option>${safe(c.name)}</option>`).join('')}</select></div><div><label>案件名稱</label><input name="name" required></div><div><label>服務類別</label><select name="category"><option>設計</option><option>系統</option><option>網站</option></select></div><div><label>預計交付日期</label><input type="date" name="due"></div></div><button>＋ 新增案件</button></form></div><div class="panel"><h2>工作清單</h2><div class="scroll"><table><thead><tr><th>客戶</th><th>案件</th><th>類別</th><th>交期</th><th>進度</th></tr></thead><tbody>${db.projects.map(x=>`<tr><td>${safe(x.customer)}</td><td>${safe(x.name)}</td><td>${safe(x.category)}</td><td>${safe(x.due)}</td><td><select onchange="setProjectStatus(${x.id},this.value)">${['待處理','進行中','待客戶確認','已完成'].map(v=>`<option ${x.status===v?'selected':''}>${v}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="5">尚無案件</td></tr>'}</tbody></table></div></div>`}
function addProject(e){e.preventDefault();db.projects.push({id:Date.now(),...Object.fromEntries(new FormData(e.target)),status:'待處理'});persist();render()}
function setProjectStatus(id,v){db.projects.find(x=>x.id===id).status=v;persist()}

// CRM outreach and recurring work planner
if(!db.followups)db.followups=[];
const baseRender=render;
render=function(){if(tab==='followups'){companyNav();renderFollowups()}else{baseRender()} if(tab==='home')addTaskSummary()};
const previousNav=companyNav;
companyNav=function(){previousNav();let n=$('nav');if(!n.querySelector('[data-followups]')){const b=document.createElement('button');b.dataset.followups='yes';b.textContent='📮 客戶追蹤／工作提醒';b.className=tab==='followups'?'active':'';b.onclick=()=>go('followups');n.appendChild(b)}};
function localDay(d=new Date()){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function dayAfter(day,n){let d=new Date(day+'T12:00:00');d.setDate(d.getDate()+n);return localDay(d)}
function taskState(t){return t.done?'已完成':t.due<localDay()?'已逾期':t.due===localDay()?'今天要做':'待辦'}
function addTaskSummary(){let a=db.followups.filter(x=>!x.done),late=a.filter(x=>x.due<localDay()),today=a.filter(x=>x.due===localDay());const box=document.createElement('div');box.className='panel';box.innerHTML=`<div class="toolbar"><h2>📮 客戶開發與待辦提醒</h2><button onclick="go('followups')">查看所有工作 →</button></div><div class="cards"><div class="stat">⏰ 已逾期<b>${late.length} 件</b></div><div class="stat">🌷 今天要做<b>${today.length} 件</b></div><div class="stat">📬 未完成<b>${a.length} 件</b></div></div><div class="scroll"><table><thead><tr><th>日期</th><th>客戶／對象</th><th>工作內容</th><th>狀態</th></tr></thead><tbody>${a.sort((x,y)=>x.due.localeCompare(y.due)).slice(0,5).map(t=>`<tr><td>${safe(t.due)}</td><td>${safe(t.customer||'自主開發')}</td><td>${safe(t.title)}</td><td>${taskState(t)}</td></tr>`).join('')||'<tr><td colspan="4">目前沒有待辦工作，新增一個開發任務吧 ♡</td></tr>'}</tbody></table></div>`;$('view').prepend(box)}
function renderFollowups(){const rows=[...db.followups].sort((a,b)=>Number(a.done)-Number(b.done)||a.due.localeCompare(b.due));$('view').innerHTML=`<div class="panel"><h2>📮 客戶追蹤與工作提醒</h2><p class="muted">記錄主動找客戶、寄作品集、兩天後追蹤、交付資料與後續聯繫。這是本機待辦提醒：打開系統會顯示到期工作，不會在關閉網頁後主動推播。</p><form onsubmit="addFollowup(event)"><div class="formgrid"><div><label>對象／客戶</label><select name="customer"><option value="">自主開發／尚無客戶</option>${db.customers.map(c=>`<option>${safe(c.name)}</option>`).join('')}</select></div><div><label>工作類型</label><select name="kind">${['開發新客戶','寄送作品／公司簡介','兩天後追蹤','報價後追蹤','電話／LINE 聯繫','寄送資料','拜訪客戶','其他待辦'].map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>要做的事</label><input name="title" placeholder="例如：寄設計作品集給餐飲品牌" required></div><div><label>預計完成日期</label><input type="date" name="due" value="${localDay()}" required></div><div><label>完成後自動建立下一次任務</label><select name="repeat"><option value="0">不重複</option><option value="2">每 2 天</option><option value="3">每 3 天</option><option value="7">每 7 天</option><option value="14">每 14 天</option><option value="30">每 30 天</option></select></div><div><label>備註／客戶回覆</label><input name="notes" placeholder="例如：客戶說下週再談"></div></div><button>＋ 新增追蹤工作</button></form></div><div class="panel"><div class="toolbar"><h2>🎀 待辦與追蹤紀錄</h2><span class="muted">${rows.filter(x=>!x.done).length} 件未完成</span></div><div class="scroll"><table><thead><tr><th>完成</th><th>日期</th><th>客戶／對象</th><th>工作內容</th><th>狀態</th><th>備註</th><th>操作</th></tr></thead><tbody>${rows.map(t=>`<tr><td><input type="checkbox" ${t.done?'checked':''} onchange="finishFollowup(${t.id},this.checked)"></td><td>${safe(t.due)}</td><td>${safe(t.customer||'自主開發')}</td><td><b>${safe(t.title)}</b><div class="muted">${safe(t.kind)}${t.repeat>0?' · 每 '+t.repeat+' 天':''}</div></td><td>${taskState(t)}</td><td>${safe(t.notes||'—')}</td><td><button class="secondary" onclick="editFollowup(${t.id})">編輯</button><button class="secondary" onclick="deleteFollowup(${t.id})">刪除</button></td></tr>`).join('')||'<tr><td colspan="7">尚無追蹤工作</td></tr>'}</tbody></table></div></div>`}
function addFollowup(e){e.preventDefault();let f=new FormData(e.target);db.followups.push({id:Date.now(),...Object.fromEntries(f),repeat:Number(f.get('repeat')),done:false});persist();render()}
function finishFollowup(id,done){let t=db.followups.find(x=>x.id===id);if(!t)return;if(done&&!t.done&&t.repeat>0){let next=dayAfter(t.due,t.repeat);while(next<=localDay())next=dayAfter(next,t.repeat);db.followups.push({...t,id:Date.now()+Math.floor(Math.random()*100000),due:next,done:false})}t.done=done;persist();render()}
function editFollowup(id){let t=db.followups.find(x=>x.id===id);if(!t)return;let title=prompt('工作內容',t.title);if(title===null)return;let due=prompt('預計完成日期 YYYY-MM-DD',t.due);if(due===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(due))return alert('請輸入正確日期');let notes=prompt('備註／客戶回覆',t.notes||'');if(notes===null)return;t.title=title;t.due=due;t.notes=notes;persist();render()}
function deleteFollowup(id){if(!confirm('確定刪除此筆追蹤紀錄？'))return;db.followups=db.followups.filter(x=>x.id!==id);persist();render()}

tab='home';persist();
render();
</script></body></html>
